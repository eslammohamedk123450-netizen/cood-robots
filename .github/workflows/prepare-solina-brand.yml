name: Prepare Solina brand assets

on:
  push:
    branches: [main]
    paths:
      - "Screenshot_٢٠٢٦١١٢٨-١٤٠٤٤٢.png"
      - "scripts/prepare_solina_brand_assets.py"
      - ".github/workflows/prepare-solina-brand.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solina-brand-assets
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Crop artwork and generate platform icons
        run: python scripts/prepare_solina_brand_assets.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding android/app/src/main/res/mipmap-*
          if git diff --cached --quiet; then
            echo "Brand assets are already up to date."
          else
            git commit -m "Add cropped Solina artwork and app icons"
            git pull --rebase origin main
            git push
          fi
