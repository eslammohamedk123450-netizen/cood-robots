name: Deploy NOVA Desk Robot to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solina-pages-account-sync
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run syntax and repository checks
        run: npm test

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '.'

  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      PAGES_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Verify published SOLINA bundle
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGES_URL"

          # Download each response completely before searching it. Piping curl
          # into grep -q can close the pipe early and make curl exit with code 23.
          fetch_and_check() {
            local url="$1"
            local marker="$2"
            local output_file="$3"
            curl --fail --silent --show-error --location "$url" --output "$output_file"
            grep -qF "$marker" "$output_file"
          }

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$PAGES_URL" --output /tmp/solina-index.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "GitHub Pages index did not become available after 12 attempts."
              exit 1
            fi
            sleep 5
          done

          grep -qF 'app.js?v=solina-stability-v5' /tmp/solina-index.html
          fetch_and_check "${PAGES_URL%/}/app.js?v=solina-stability-v5" 'SPEECH_QUOTA_EXCEEDED' /tmp/solina-app.js
          fetch_and_check "${PAGES_URL%/}/conversation-context.js?v=topic-followup-v1" 'classifyConversationTurn' /tmp/solina-conversation-context.js
          fetch_and_check "${PAGES_URL%/}/speech-quota.js?v=quota-fallback-v1" 'isSpeechQuotaCoolingDown' /tmp/solina-speech-quota.js
